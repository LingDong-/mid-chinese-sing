<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Roll</title>
<style>
  :root { --fg: #222; --mute: #888; --bg: #fafaf8; --line: #ddd; --grid: #eeece6; --bar: #dcd8cf; --head: #b33; }
  @media (prefers-color-scheme: dark) { :root { --fg: #ddd; --mute: #888; --bg: #161616; --line: #333; --grid: #222; --bar: #2e2e2e; --head: #e77; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.5 -apple-system, system-ui, sans-serif; }
  main { padding: 20px 16px 40px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin: 8px 0; }
  select, input, button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); padding: 3px 6px; }
  input[type=number] { width: 60px; } button { cursor: pointer; padding: 4px 12px; }
  #info, .hint { color: var(--mute); font-size: 12px; }
  #roll { display: flex; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 10px; }
  #labels { flex: none; width: 92px; position: relative; border-right: 1px solid var(--line); }
  #labels div { position: absolute; left: 8px; right: 6px; font-size: 12px; line-height: 1.25; }
  #labels b { font: 15px HanaMinA, serif; font-weight: normal; display: block; }
  #wrap { flex: 1; overflow-x: auto; position: relative; }
  canvas { display: block; }
  #tip { position: fixed; pointer-events: none; background: var(--bg); border: 1px solid var(--line); padding: 3px 6px; font-size: 12px; display: none; white-space: nowrap; }
</style>
</head>
<body>
<main>
  <h1>Music Roll <span id="info"></span></h1>
  <div class="row">
    <select id="poem"></select>
    <label>mode <select id="mode"><option value="">auto</option><option>宮</option><option>商</option><option>角</option><option>徵</option><option>羽</option></select></label>
    <label>seed <input id="seed" type="number" value="1"></label>
    <label>pronunciation <select id="era"><option value="late">晚唐</option><option value="high">盛唐</option></select></label>
    <label>music <select id="band"><option value="full">full band</option><option value="sing">簫 琵琶 拍板</option><option value="voice">voice only</option></select></label>
    <button id="go">compose</button>
    <button id="play" disabled>▶ play</button>
    <span id="time" class="hint"></span>
  </div>
  <div class="hint">One lane per part, pitch rising upward within each lane; grey lines are beats, darker ones every 4 beats. Click the roll to jump, hover a note for details.</div>
  <div id="roll"><div id="labels"></div><div id="wrap"><canvas id="cv"></canvas></div></div>
  <div id="tip"></div>
</main>
<script src="speech/mcsynth.js"></script>
<script src="sing.js"></script>
<script src="band.js"></script>
<script>
var $ = function (id) { return document.getElementById(id); }, dict = null, R = null, song = null, EVs = [], lanes = [], ac = null, src = null, t0 = 0, off = 0, PPS = 60, gongM = 0, spb = 1, lead = 0;
// parts, top to bottom: name, Chinese, colour, lane height
var PARTS = [['voice', '歌', '#c0504d', 150], ['xiao', '簫', '#5b8a72', 70], ['di', '笛', '#4f7fa8', 70], ['sheng', '笙', '#9a7bb5', 80], ['pipa', '琵琶', '#c08a3e', 80],
  ['qin', '琴', '#7a6a55', 70], ['zheng', '箏', '#b07a9a', 70], ['ruan', '阮', '#6f7f3f', 60], ['bell', '方響', '#8c8c8c', 40], ['ban', '拍板', '#a0522d', 36], ['drum', '鼓', '#666', 36]];
var EN = { voice: 'voice', xiao: 'end-blown flute', di: 'transverse flute', sheng: 'mouth organ', pipa: 'lute', qin: 'zither', zheng: 'zither', ruan: 'lute', bell: 'chime', ban: 'clapper', drum: 'drum' };
var NUM = { 0: '1', 2: '2', 4: '3', 5: '4', 6: '#4', 7: '5', 9: '6', 11: '7' }, NAMES = ['C', 'C#', 'D', 'Eb', 'E', 'F', 'F#', 'G', 'Ab', 'A', 'Bb', 'B'];
SING.POEMS.forEach(function (p, i) { var o = document.createElement('option'); o.value = i; o.textContent = p.title; $('poem').appendChild(o); });
$('poem').value = 2;
fetch('speech/mc_dict.json').then(function (r) { return r.json(); }).then(function (d) { dict = d; compose(); })
  .catch(function () { $('info').textContent = '— serve this folder over http (python3 -m http.server) so the dictionary can load'; });

function compose() {
  stop(); $('info').textContent = 'rendering…'; $('play').disabled = true;
  setTimeout(function () {
    song = SING.compose(SING.POEMS[$('poem').value].text, dict, { seed: +$('seed').value || 1, mode: $('mode').value || undefined, era: $('era').value });
    var ev = [], b = $('band').value, o = { voice: 'woman', seed: +$('seed').value || 1, events: ev };
    R = b === 'full' ? BAND.render(song, o) : SING.render(song, Object.assign(o, { band: b === 'voice' ? '' : undefined }));
    EVs = ev; spb = 60 / song.tempo; lead = R.syls[0].on - song.phrases[0].syl[0].t * spb;
    var v0 = ev.find(function (e) { return e.part === 'voice'; }); gongM = Math.round(v0.m - song.phrases[0].syl[0].notes[0].p);
    $('info').textContent = song.mode + '調式 · 1 = ' + NAMES[((gongM % 12) + 12) % 12] + ' · ♩ = ' + song.tempo + ' · ' + (R.L.length / R.sr).toFixed(1) + ' s';
    layout(); draw(0); $('play').disabled = false;
  }, 20);
}
function layout() {   // lanes for the parts that actually play, each with its own pitch range
  lanes = []; var y = 0, L = $('labels'); L.innerHTML = '';
  PARTS.forEach(function (P) {
    var es = EVs.filter(function (e) { return e.part === P[0]; }); if (!es.length) return;
    var ms = es.filter(function (e) { return e.m != null; }).map(function (e) { return e.m; }), lo = ms.length ? Math.min.apply(0, ms) - 1 : 0, hi = ms.length ? Math.max.apply(0, ms) + 1 : 1;
    lanes.push({ part: P[0], zh: P[1], col: P[2], y: y, h: P[3], lo: lo, hi: hi, ev: es });
    var d = document.createElement('div'); d.style.top = (y + 6) + 'px'; d.innerHTML = P[3] < 50 ? '<b style="display:inline">' + P[1] + '</b> ' + EN[P[0]] : '<b>' + P[1] + '</b>' + EN[P[0]]; L.appendChild(d);
    y += P[3];
  });
  var dur = R.L.length / R.sr, cv = $('cv'), dpr = window.devicePixelRatio || 1;
  cv.width = Math.ceil(dur * PPS * dpr); cv.height = Math.ceil(y * dpr); cv.style.width = dur * PPS + 'px'; cv.style.height = y + 'px'; L.style.height = y + 'px';
}
function noteY(l, m) { var top = l.part === 'voice' ? l.y + 8 : l.y + 6, bot = l.part === 'voice' ? l.y + l.h - 46 : l.y + l.h - 6; return bot - (m - l.lo) / Math.max(1, l.hi - l.lo) * (bot - top); }
function draw(t) {
  var cv = $('cv'), g = cv.getContext('2d'), dpr = window.devicePixelRatio || 1, cs = getComputedStyle(document.documentElement), W = cv.width / dpr, dur = R.L.length / R.sr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, cv.height / dpr);
  for (var b = Math.ceil(-lead / spb); lead + b * spb < dur; b++) { var x = (lead + b * spb) * PPS; g.fillStyle = b % 4 === 0 ? cs.getPropertyValue('--bar') : cs.getPropertyValue('--grid'); g.fillRect(x, 0, 1, cv.height); }
  lanes.forEach(function (l) {
    g.fillStyle = cs.getPropertyValue('--line'); g.fillRect(0, l.y + l.h - 1, W, 1);
    var nh = l.ev[0].m == null ? l.h - 10 : Math.max(3, Math.min(9, (l.h - 20) / Math.max(1, l.hi - l.lo)));
    l.ev.forEach(function (e) {
      var x = e.t0 * PPS, w = Math.max(2, (e.t1 - e.t0) * PPS), on = t >= e.t0 && t < e.t1, y = e.m == null ? l.y + 5 : noteY(l, e.m) - nh / 2;
      g.globalAlpha = on ? 1 : 0.62; g.fillStyle = l.col; g.fillRect(x, y, w, nh);
      if (l.part === 'voice' && e.ch) {   // lyrics: character and Baxter under the voice lane
        g.globalAlpha = on || (t >= e.t0 && t < e.t1 + 0.3) ? 1 : 0.8; g.fillStyle = cs.getPropertyValue('--fg'); g.font = '16px HanaMinA, serif'; g.fillText(e.ch, x, l.y + l.h - 24);
        g.fillStyle = cs.getPropertyValue('--mute'); g.font = '10px "Source Code Pro", Menlo, monospace'; g.fillText(e.bax, x, l.y + l.h - 9);
      }
    });
    g.globalAlpha = 1;
  });
  g.fillStyle = cs.getPropertyValue('--head'); g.fillRect(t * PPS, 0, 1.5, cv.height);
  $('time').textContent = t.toFixed(1) + ' / ' + dur.toFixed(1) + ' s';
}
// playback: one AudioBuffer, the roll follows the audio clock
function now() { return src ? off + ac.currentTime - t0 : off; }
function play() {
  if (src) { off = now(); stop(); draw(off); return; }
  ac = ac || new AudioContext(); var buf = ac.createBuffer(2, R.L.length, R.sr); buf.getChannelData(0).set(R.L); buf.getChannelData(1).set(R.R);
  src = ac.createBufferSource(); src.buffer = buf; src.connect(ac.destination); t0 = ac.currentTime; src.start(0, Math.min(off, buf.duration - 0.01));
  src.onended = function () { if (src && now() >= buf.duration - 0.05) { stop(); off = 0; draw(0); } };
  $('play').textContent = '❚❚ pause'; tick();
}
function stop() { if (src) { src.onended = null; try { src.stop(); } catch (e) {} } src = null; $('play').textContent = '▶ play'; }
function tick() {
  if (!src) return; var t = now(), wr = $('wrap'), x = t * PPS;
  if (x < wr.scrollLeft + 40 || x > wr.scrollLeft + wr.clientWidth * 0.7) wr.scrollLeft = x - wr.clientWidth * 0.3;
  draw(t); requestAnimationFrame(tick);
}
$('play').onclick = play; $('go').onclick = compose;
$('cv').onclick = function (e) { var t = e.offsetX / PPS, was = !!src; if (was) stop(); off = t; draw(t); if (was) play(); };
$('cv').onmousemove = function (e) {   // hover: which note, pitch as 簡譜 degree and note name
  var t = e.offsetX / PPS, y = e.offsetY, l = lanes.find(function (q) { return y >= q.y && y < q.y + q.h; }), tip = $('tip'); tip.style.display = 'none'; if (!l) return;
  var best = null, bd = 9; l.ev.forEach(function (n) { if (t < n.t0 - 0.05 || t > n.t1 + 0.05) return; var d = n.m == null ? 0 : Math.abs(noteY(l, n.m) - y); if (d < bd) { bd = d; best = n; } });
  if (!best) return;
  var s = l.zh + ' ' + EN[l.part] + (best.ch ? ' · ' + best.ch + ' ' + best.bax : '');
  if (best.m != null) { var m = Math.round(best.m), dg = ((m - gongM) % 12 + 12) % 12, oc = Math.floor((m - gongM) / 12); s += ' · ' + (NUM[dg] || '?') + (oc > 0 ? "'".repeat(oc) : ','.repeat(-oc)) + ' (' + NAMES[m % 12] + (Math.floor(m / 12) - 1) + ')'; }
  s += ' · ' + best.t0.toFixed(2) + '–' + best.t1.toFixed(2) + ' s';
  tip.textContent = s; tip.style.display = 'block'; tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px';
};
$('cv').onmouseleave = function () { $('tip').style.display = 'none'; };
</script>
</body>
</html>
