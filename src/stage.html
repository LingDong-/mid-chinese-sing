<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歌姬 · Tang Singer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0806; color: #cbb; font: 13px/1.4 -apple-system, system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #ui { position: fixed; left: 14px; bottom: 12px; display: flex; gap: 8px; align-items: center; opacity: 0.85; }
  #ui select, #ui button { font: inherit; color: inherit; background: rgba(0, 0, 0, 0.35); border: 1px solid rgba(255, 255, 255, 0.18); padding: 3px 8px; }
  #ui button { cursor: pointer; }
  #status { color: #998; }
  #orbitHint { color: #887a6c; font-size: 11px; display: none; }
  body.orbit #orbitHint { display: inline; }
  /* karaoke: one column per syllable — character, Baxter transcription, reconstructed IPA */
  #lyric { position: fixed; left: 12px; right: 12px; bottom: clamp(56px, 9vh, 110px); display: flex; flex-wrap: wrap; justify-content: center; gap: 4px clamp(12px, 2.2vw, 34px); color: #e8dccb; text-shadow: 0 0 10px #000, 0 0 3px #000; pointer-events: none; }
  #lyric .sy { display: flex; flex-direction: column; align-items: center; min-width: 1.4em; }
  #lyric .c { font: clamp(20px, 2.9vw, 38px)/1.2 "HanaMinA", "Hiragino Mincho ProN", "Songti TC", "Songti SC", "Noto Serif CJK TC", serif; }
  #lyric .b, #lyric .p { font: 500 clamp(14px, 2.15vw, 28px)/1.3 "Source Code Pro", "Doulos SIL", ui-monospace, Menlo, monospace; color: #b3a491; white-space: nowrap; }
  #lyric .p { color: #8f8476; }
  #lyric .b, #lyric .p { text-shadow: 0 0 1.5px #000, 0 0 1.5px #000, 0 0 2.5px #000, 0 0 6px #000; }   /* a dark rim: legible over the scene and after compression */
  /* row labels: same line boxes as the syllable columns (the strut keeps the rows aligned), small muted text */
  #lyric .lab { align-items: flex-end; min-width: 0; margin-right: 0.15em; flex: none; }
  #lyric .lab i { font: 500 0.6em/1 "Source Code Pro", ui-monospace, Menlo, monospace; font-style: normal; letter-spacing: 0.02em; color: #8a7e70; white-space: nowrap; vertical-align: middle; }
  #lyric .on .c, #lyric .on .b, #lyric .on .p { color: #f0a080; }
  body.shot #ui, body.shot #lyric { display: none; }
  body.shot.lyrics #lyric { display: flex; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="lyric"></div>
<div id="ui">
  <select id="style"><option value="tang">唐 Tang</option><option value="song">宋 Song</option></select>
  <select id="poem"></select>
  <select id="band"><option value="sing">voice + 簫琵琶</option><option value="band">full band</option></select>
  <button id="play">▶</button>
  <select id="cam"><option value="auto">camera: auto</option><option value="full">full</option><option value="medium">medium</option><option value="face">face</option><option value="orbit">orbit (drag)</option></select>
  <span id="orbitHint">drag: rotate · shift-drag / right-drag / middle-drag / two-finger drag: pan · wheel / pinch: zoom · double-click: reset</span>
  <span id="status"></span>
</div>
<script src="speech/mcsynth.js"></script>
<script src="sing.js"></script>
<script src="band.js"></script>
<script src="figure.js"></script>
<script src="stage.js"></script>
</body>
</html>
